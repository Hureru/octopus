<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Octopus 验证桥</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">O</div>
        <div>
          <h1>验证桥</h1>
          <p>Octopus 管理员配对</p>
        </div>
      </header>

      <section aria-labelledby="connection-title">
        <h2 id="connection-title">连接设置</h2>
        <label>
          Octopus 地址
          <input id="base-url" type="url" placeholder="http://127.0.0.1:8080" autocomplete="url">
        </label>
        <label>
          配对令牌
          <input id="pairing-token" type="password" autocomplete="off">
        </label>
        <label class="check-row">
          <input id="show-token" type="checkbox">
          显示令牌
        </label>
        <div class="button-row">
          <button id="save" type="button">保存</button>
          <button id="claim" class="primary" type="button">领取任务</button>
        </div>
      </section>

      <section id="task-section" aria-labelledby="task-title" hidden>
        <h2 id="task-title">当前任务</h2>
        <dl>
          <div>
            <dt>目标站点</dt>
            <dd id="task-host"></dd>
          </div>
          <div>
            <dt>操作</dt>
            <dd id="task-operation"></dd>
          </div>
          <div>
            <dt>到期时间</dt>
            <dd id="task-expires"></dd>
          </div>
        </dl>
        <div class="button-grid">
          <button id="open" class="primary" type="button">打开验证页面</button>
          <button id="submit" type="button">提交验证会话</button>
          <button id="release" class="danger" type="button">释放任务</button>
        </div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
