allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
# brace-expansion 1.1.18 contains the maxLength backport for CVE-2026-14257,
# but the registry advisory still marks every pre-5.x release as vulnerable.
auditConfig:
  ignoreCves:
    - CVE-2026-14257
overrides:
  '@babel/core@>=7.0.0 <=7.29.0': 7.29.6
  brace-expansion@>=1.0.0 <1.1.19: 1.1.18
  brace-expansion@>=2.0.0 <2.1.2: 2.1.2
  brace-expansion@>=5.0.0 <5.0.8: 5.0.8
  dompurify@>=3.0.0 <=3.4.11: 3.4.12
  flatted@>=3.0.0 <=3.4.1: 3.4.2
  js-cookie@>=3.0.0 <=3.0.5: 3.0.7
  js-yaml@>=4.0.0 <4.3.0: 4.3.0
  lodash-es@>=4.0.0 <=4.17.23: 4.18.1
  lodash@>=4.0.0 <=4.17.23: 4.18.1
  mermaid@>=11.0.0-alpha.1 <=11.14.0: 11.16.0
  minimatch@<3.1.5: 3.1.5
  minimatch@>=9.0.0 <9.0.7: 9.0.7
  next-intl@>=4.0.0 <4.9.2: 4.13.4
  picomatch@<2.3.2: 2.3.2
  picomatch@>=4.0.0 <4.0.4: 4.0.4
  postcss@>=8.0.0 <8.5.18: 8.5.18
  sharp@>=0.34.0 <0.35.0: 0.35.3
  uuid@>=10.0.0 <11.1.1: 11.1.1
  uuid@>=13.0.0 <13.0.1: 13.0.1
  yaml@>=1.0.0 <1.10.3: 1.10.3
